<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1810" viewBox="0 0 1800 1810" role="img" aria-labelledby="title desc">
<title id="title">配置子菜单：证书、身份与隧道</title>
<desc id="desc">按实际输入路径列出菜单、子菜单、功能与影响范围。可配合MENU-GUIDE.md读取完整文字。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#162b3c}.h{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#526878}.group{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:600}.note{font-size:20px;fill:#42596b}.foot{font-size:23px;fill:#42596b}.path{font-family:Consolas,"Microsoft YaHei",monospace;fill:#526878;font-size:18px}</style>
<rect width="1800" height="1810" fill="#f2f6fa"/>
<rect x="60" y="44" width="8" height="65" rx="4" fill="#0e7490"/>
<text x="90" y="84" class="h">02 / 配置子菜单：证书、身份与隧道</text>
<text x="90" y="127" class="sub">入口3的选项1–6；VMess Argo与独立XHTTP Argo不要混用。</text>
<text x="90" y="164" class="path">VPS v26.11.21-fork.18 / Serv00 v26.11.21-fork.2 · 路径数字对应实际输入顺序 · 非远程控制界面</text>
<rect x="60" y="195" width="820" height="631" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="60" y="195" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="90" y="239" class="group">3 → 1　证书 / REALITY域名</text>
<text x="112" y="289" class="path">3→1→1</text>
<path d="M 100 277 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="319" class="label">VLESS REALITY伪装域名</text>
<text x="112" y="349" class="note">输入域名，回车默认apple.com；不是为该域名申请证书。</text>
<text x="112" y="374" class="path">3→1→2</text>
<path d="M 100 362 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="404" class="label">VMess WS的TLS切换</text>
<text x="112" y="434" class="note">Acme可用时切换TLS；VMess入站开启TLS后不能使用此VMess Argo菜</text>
<text x="112" y="461" class="note">单。</text>
<text x="112" y="486" class="path">3→1→3</text>
<path d="M 100 474 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="516" class="label">Hysteria2证书切换</text>
<text x="112" y="546" class="note">自签证书与已有Acme证书切换，随后更新客户端。</text>
<text x="112" y="571" class="path">3→1→4</text>
<path d="M 100 559 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="601" class="label">TUIC5证书切换</text>
<text x="112" y="631" class="note">自签证书与已有Acme证书切换。</text>
<text x="112" y="656" class="path">3→1→5</text>
<path d="M 100 644 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="686" class="label">AnyTLS证书切换</text>
<text x="112" y="716" class="note">现代核心分支可见；使用已有Acme证书或自签证书。</text>
<text x="112" y="741" class="path">3→1→0</text>
<path d="M 100 729 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="771" class="label">返回配置菜单</text>
<text x="112" y="801" class="note">证书申请入口在主菜单12，不在本子菜单直接签发。</text>
<rect x="60" y="866" width="820" height="689" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="60" y="866" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="90" y="910" class="group">3 → 3　VMess专用Argo</text>
<text x="112" y="960" class="path">3→3→1</text>
<path d="M 100 948 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="990" class="label">临时隧道管理</text>
<text x="112" y="1020" class="note">VMess入站必须关闭TLS；默认不需自有域名。</text>
<text x="134" y="1045" class="path">3→3→1→1</text>
<path d="M 122 1033 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="1075" class="label">重置临时域名 / 启动</text>
<text x="134" y="1105" class="note">启动本机VMess回源隧道；域名会变化，更新客户端订阅。</text>
<text x="134" y="1130" class="path">3→3→1→2</text>
<path d="M 122 1118 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="1160" class="label">停止临时隧道</text>
<text x="134" y="1190" class="note">清理本项目临时隧道进程与任务，不停止独立XHTTP隧道。</text>
<text x="112" y="1215" class="path">3→3→2</text>
<path d="M 100 1203 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1245" class="label">固定隧道管理</text>
<text x="112" y="1275" class="note">准备Cloudflare隧道、域名和Token；回源端口为VMess端口。</text>
<text x="134" y="1300" class="path">3→3→2→1</text>
<path d="M 122 1288 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="1330" class="label">设置 / 重置固定隧道</text>
<text x="134" y="1360" class="note">输入Token和域名；云端HTTP路由回源本机VMess端口。</text>
<text x="134" y="1385" class="path">3→3→2→2</text>
<path d="M 122 1373 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="1415" class="label">停止固定隧道</text>
<text x="134" y="1445" class="note">仅停止本机VMess固定隧道，不删除Cloudflare云端对象。</text>
<text x="112" y="1470" class="path">3→3→0</text>
<path d="M 100 1458 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1500" class="label">返回配置菜单</text>
<text x="112" y="1530" class="note">临时/固定各自子菜单0返回Argo选择。</text>
<rect x="920" y="195" width="820" height="689" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="920" y="195" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="950" y="239" class="group">3 → 2 / 3 → 4　身份与IP优先级</text>
<text x="994" y="289" class="path">3→2→1</text>
<path d="M 982 277 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="319" class="label">设置共用UUID / 密码</text>
<text x="994" y="349" class="note">五协议共用，回车随机生成；不改变独立XHTTP UUID。</text>
<text x="994" y="374" class="path">3→2→2</text>
<path d="M 982 362 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="404" class="label">修改VMess路径</text>
<text x="994" y="434" class="note">回车不变；只改VMess WS的Path。</text>
<text x="994" y="459" class="path">3→2→0</text>
<path d="M 982 447 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="489" class="label">返回配置菜单</text>
<text x="994" y="519" class="note">保留现有配置。</text>
<text x="994" y="544" class="path">3→4→1</text>
<path d="M 982 532 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="574" class="label">IPv4优先</text>
<text x="994" y="604" class="note">仅1.10系列；需要存在IPv4。</text>
<text x="994" y="629" class="path">3→4→2</text>
<path d="M 982 617 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="659" class="label">IPv6优先</text>
<text x="994" y="689" class="note">仅1.10系列；需要存在IPv6。</text>
<text x="994" y="714" class="path">3→4→3</text>
<path d="M 982 702 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="744" class="label">仅IPv4</text>
<text x="994" y="774" class="note">仅1.10系列；独立XHTTP出站不跟随。</text>
<text x="994" y="799" class="path">3→4→4</text>
<path d="M 982 787 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="829" class="label">仅IPv6</text>
<text x="994" y="859" class="note">仅1.10系列；独立XHTTP出站不跟随。</text>
<rect x="920" y="924" width="820" height="434" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="920" y="924" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="950" y="968" class="group">3 → 5 / 3 → 6　通知与WireGuard</text>
<text x="994" y="1018" class="path">3→5→1</text>
<path d="M 982 1006 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="1048" class="label">配置Telegram通知</text>
<text x="994" y="1078" class="note">输入机器人Token及用户ID；当前配置会触发通知发送。</text>
<text x="994" y="1103" class="path">3→5→0</text>
<path d="M 982 1091 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="1133" class="label">返回配置菜单</text>
<text x="994" y="1163" class="note">手动发送通知入口为9→3。</text>
<text x="994" y="1188" class="path">3→6→1</text>
<path d="M 982 1176 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="1218" class="label">更换Warp WireGuard账户</text>
<text x="994" y="1248" class="note">显示当前参数及新随机账户；输入私钥、IPv6和Reserved。</text>
<text x="994" y="1273" class="path">3→6→0</text>
<path d="M 982 1261 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="1303" class="label">返回配置菜单</text>
<text x="994" y="1333" class="note">只影响Sing-box出站；参数显示可能含私钥，勿公开日志。</text>
<line x1="60" x2="1740" y1="1595" y2="1595" stroke="#c6d6e2"/>
<text x="60" y="1639" class="foot">• 3→1的选项2–5受已申请Acme证书条件控制；1.10分支不提供AnyTLS。</text>
<text x="60" y="1670" class="foot">• 改UUID、证书、VMess路径或端口后，应刷新并重新拉取客户端订阅；这些设置不改独立XHTTP。</text>
<text x="60" y="1782" class="path">sing-box-yg / redrohu fork · 02 / 07 · 2026-11-21 · 源码与文字详表：docs/MENU-GUIDE.md</text>
</svg>
