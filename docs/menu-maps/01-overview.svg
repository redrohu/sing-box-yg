<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1394" viewBox="0 0 1800 1394" role="img" aria-labelledby="title desc">
<title id="title">VPS 主菜单总览</title>
<desc id="desc">按实际输入路径列出菜单、子菜单、功能与影响范围。可配合MENU-GUIDE.md读取完整文字。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#162b3c}.h{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#526878}.group{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:600}.note{font-size:20px;fill:#42596b}.foot{font-size:23px;fill:#42596b}.path{font-family:Consolas,"Microsoft YaHei",monospace;fill:#526878;font-size:18px}</style>
<rect width="1800" height="1394" fill="#f2f6fa"/>
<rect x="60" y="44" width="8" height="65" rx="4" fill="#0e7490"/>
<text x="90" y="84" class="h">01 / VPS 主菜单总览</text>
<text x="90" y="127" class="sub">从安装到维护：先选择管理范围，再进入对应子菜单。</text>
<text x="90" y="164" class="path">VPS v26.11.21-fork.18 / Serv00 v26.11.21-fork.2 · 路径数字对应实际输入顺序 · 非远程控制界面</text>
<rect x="60" y="195" width="820" height="689" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="60" y="195" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="90" y="239" class="group">部署与日常连接</text>
<text x="90" y="289" class="path">1</text>
<text x="90" y="319" class="label">一键安装 Sing-box</text>
<text x="90" y="349" class="note">按提示处理IP/防火墙、核心、证书和端口；不会自动部署XHTTP。</text>
<text x="90" y="374" class="path">2</text>
<text x="90" y="404" class="label">完整卸载本脚本</text>
<text x="90" y="434" class="note">移除Sing-box、已部署XHTTP及本机隧道/配置/密钥；操作前备份。</text>
<text x="90" y="459" class="path">3</text>
<text x="90" y="489" class="label">配置管理</text>
<text x="90" y="519" class="note">证书、UUID、VMess Argo、订阅、连接地址、节点名称和独立XHTTP。</text>
<text x="90" y="544" class="path">4</text>
<text x="90" y="574" class="label">Sing-box五协议端口 / UDP转发</text>
<text x="90" y="604" class="note">HY2/TUIC有多端口子菜单；XHTTP端口不在这里更改。</text>
<text x="90" y="629" class="path">5</text>
<text x="90" y="659" class="label">Sing-box三通道域名分流</text>
<text x="90" y="689" class="note">Warp WireGuard / SOCKS5 / 本地出站；限制随核心分支变化。</text>
<text x="90" y="714" class="path">6</text>
<text x="90" y="744" class="label">Sing-box重启 / 关闭</text>
<text x="90" y="774" class="note">仅主服务；不控制XHTTP、XHTTP Argo的独立服务。</text>
<text x="90" y="799" class="path">9</text>
<text x="90" y="829" class="label">节点、配置与订阅</text>
<text x="90" y="859" class="note">本地刷新、Gitlab远端推送、Telegram通知分开处理。</text>
<rect x="920" y="195" width="820" height="944" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="920" y="195" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="950" y="239" class="group">版本、排查与扩展</text>
<text x="950" y="289" class="path">7</text>
<text x="950" y="319" class="label">更新 Sing-box-yg脚本</text>
<text x="950" y="349" class="note">更新菜单和脚本版本；不会自动升级Sing-box/Xray内核。</text>
<text x="950" y="374" class="path">8</text>
<text x="950" y="404" class="label">切换 / 更新 Sing-box内核</text>
<text x="950" y="434" class="note">正式版、测试版或指定版本；检查现有配置，失败回滚。</text>
<text x="950" y="459" class="path">10</text>
<text x="950" y="489" class="label">查看 Sing-box日志</text>
<text x="950" y="519" class="note">systemd journal或OpenRC日志；XHTTP日志见3→11。</text>
<text x="950" y="544" class="path">11</text>
<text x="950" y="574" class="label">调用外部BBR优化脚本</text>
<text x="950" y="604" class="note">按虚拟化条件拦截；不保证提速，外部菜单非本仓库固定。</text>
<text x="950" y="629" class="path">12</text>
<text x="950" y="659" class="label">调用外部Acme证书脚本</text>
<text x="950" y="689" class="note">申请/管理证书；申请后可在3→1切换证书模式。</text>
<text x="950" y="714" class="path">13</text>
<text x="950" y="744" class="label">调用外部Warp管理脚本</text>
<text x="950" y="774" class="note">Warp及解锁检测；菜单来自外部下载脚本。</text>
<text x="950" y="799" class="path">14</text>
<text x="950" y="829" class="label">本地SOCKS5 / 多地区Psiphon</text>
<text x="950" y="859" class="note">WARP-plus-Socks5辅助进程，不是新客户端入站协议。</text>
<text x="950" y="884" class="path">15</text>
<text x="950" y="914" class="label">刷新本地IP / 输出地址族</text>
<text x="950" y="944" class="note">双栈可选IPv4/IPv6；更新导出地址，不改变系统IP分配。</text>
<text x="950" y="969" class="path">16</text>
<text x="950" y="999" class="label">本fork帮助与菜单导航</text>
<text x="950" y="1029" class="note">项目说明、兼容说明、独立XHTTP范围及Serv00迁移说明。</text>
<text x="950" y="1054" class="path">0</text>
<text x="950" y="1084" class="label">退出脚本</text>
<text x="950" y="1114" class="note">不主动停止已运行的服务。</text>
<line x1="60" x2="1740" y1="1179" y2="1179" stroke="#c6d6e2"/>
<text x="60" y="1223" class="foot">• 数字0在主菜单退出；多数子菜单0返回或结束当前子菜单，XHTTP子菜单选择一次后结束，不保证自动重新绘制上层菜单。</text>
<text x="60" y="1254" class="foot">• 主菜单2完整卸载含独立XHTTP；4/5/6/8等Sing-box设置不会自动同步至独立XHTTP。</text>
<text x="60" y="1366" class="path">sing-box-yg / redrohu fork · 01 / 07 · 2026-11-21 · 源码与文字详表：docs/MENU-GUIDE.md</text>
</svg>
