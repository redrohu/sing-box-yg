<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1667" viewBox="0 0 1800 1667" role="img" aria-labelledby="title desc">
<title id="title">订阅、连接地址与节点名称</title>
<desc id="desc">按实际输入路径列出菜单、子菜单、功能与影响范围。可配合MENU-GUIDE.md读取完整文字。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#162b3c}.h{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#526878}.group{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:600}.note{font-size:20px;fill:#42596b}.foot{font-size:23px;fill:#42596b}.path{font-family:Consolas,"Microsoft YaHei",monospace;fill:#526878;font-size:18px}</style>
<rect width="1800" height="1667" fill="#f2f6fa"/>
<rect x="60" y="44" width="8" height="65" rx="4" fill="#0e7490"/>
<text x="90" y="84" class="h">03 / 订阅、连接地址与节点名称</text>
<text x="90" y="127" class="sub">入口3的选项7–10及主菜单9：生成、发布、拉取是三件事。</text>
<text x="90" y="164" class="path">VPS v26.11.21-fork.18 / Serv00 v26.11.21-fork.2 · 路径数字对应实际输入顺序 · 非远程控制界面</text>
<rect x="60" y="195" width="820" height="743" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="60" y="195" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="90" y="239" class="group">3 → 7 / 3 → 8　订阅发布</text>
<text x="134" y="289" class="path">3→7→1</text>
<path d="M 122 277 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="319" class="label">设置 / 重置Gitlab订阅</text>
<text x="134" y="349" class="note">输入邮箱、访问令牌、用户/项目及可选分支；先生成再推送，不</text>
<text x="134" y="376" class="note">强制覆盖冲突。</text>
<text x="134" y="401" class="path">3→7→0</text>
<path d="M 122 389 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="431" class="label">返回配置菜单</text>
<text x="134" y="461" class="note">远端配置好后日常发布用9→2；订阅URL包含凭据，勿公开。</text>
<text x="134" y="486" class="path">3→8→1</text>
<path d="M 122 474 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="516" class="label">安装 / 重置本地IP订阅</text>
<text x="134" y="546" class="note">设置路径密码（默认当前UUID）及端口（默认随机），启动HTTP文</text>
<text x="134" y="573" class="note">件服务。</text>
<text x="134" y="598" class="path">3→8→2</text>
<path d="M 122 586 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="628" class="label">更换订阅路径密码</text>
<text x="134" y="658" class="note">更新URL路径；客户端必须换用新链接。</text>
<text x="134" y="683" class="path">3→8→3</text>
<path d="M 122 671 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="713" class="label">更换本地订阅端口</text>
<text x="134" y="743" class="note">未被占用的端口；还需处理云端/系统防火墙。</text>
<text x="134" y="768" class="path">3→8→4</text>
<path d="M 122 756 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="798" class="label">卸载本地IP订阅</text>
<text x="134" y="828" class="note">停止文件服务、清理发布目录及本项目开机任务。</text>
<text x="134" y="853" class="path">3→8→0</text>
<path d="M 122 841 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="883" class="label">返回配置菜单</text>
<text x="134" y="913" class="note">只退出此设置页，不停代理服务。</text>
<rect x="60" y="978" width="820" height="434" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="60" y="978" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="90" y="1022" class="group">9　刷新、查看与通知</text>
<text x="112" y="1072" class="path">9→1</text>
<path d="M 100 1060 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1102" class="label">刷新本地订阅 / 查看节点</text>
<text x="112" y="1132" class="note">生成分享链接、二维码及聚合订阅；不推送Gitlab。</text>
<text x="112" y="1157" class="path">9→2</text>
<path d="M 100 1145 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1187" class="label">配置查看 / Gitlab发布</text>
<text x="112" y="1217" class="note">刷新本地Mihomo/Sing-box配置；若已设置Gitlab，同时推送远端。</text>
<text x="112" y="1242" class="path">9→3</text>
<path d="M 100 1230 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1272" class="label">Telegram通知</text>
<text x="112" y="1302" class="note">刷新本地节点后调用已配置的通知脚本；不等于Gitlab发布。</text>
<text x="112" y="1327" class="path">9→0</text>
<path d="M 100 1315 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1357" class="label">返回主菜单</text>
<text x="112" y="1387" class="note">客户端需要主动重新拉取，脚本不能代替客户端刷新。</text>
<rect x="920" y="195" width="820" height="434" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="920" y="195" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="950" y="239" class="group">3 → 9　VMess连接地址</text>
<text x="972" y="289" class="path">3→9→1</text>
<path d="M 960 277 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="319" class="label">设置VMess主节点连接地址</text>
<text x="972" y="349" class="note">手动填IP/域名；需要时提示Host/SNI，CDN回源域名需正确配置。</text>
<text x="972" y="374" class="path">3→9→2</text>
<path d="M 960 362 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="404" class="label">清除主节点Host/SNI覆盖</text>
<text x="972" y="434" class="note">不是清除server连接地址；想改连接地址需再选1。</text>
<text x="972" y="459" class="path">3→9→3</text>
<path d="M 960 447 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="489" class="label">设置所有VMess Argo连接地址</text>
<text x="972" y="519" class="note">固定/临时VMess Argo共用，不改XHTTP Argo；不会自动测速。</text>
<text x="972" y="544" class="path">3→9→0</text>
<path d="M 960 532 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="574" class="label">返回配置菜单</text>
<text x="972" y="604" class="note">XHTTP Argo独立连接地址见3→11→9→8。</text>
<rect x="920" y="669" width="820" height="604" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="920" y="669" width="8" height="64" rx="4" fill="#0e7490"/>
<text x="950" y="713" class="group">3 → 10　名称前后缀</text>
<text x="972" y="763" class="path">3→10→1</text>
<path d="M 960 751 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="793" class="label">设置自定义后缀</text>
<text x="972" y="823" class="note">退出无后缀模式；仅改显示名称与分组引用。</text>
<text x="972" y="848" class="path">3→10→2</text>
<path d="M 960 836 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="878" class="label">恢复主机名后缀</text>
<text x="972" y="908" class="note">不修改系统主机名。</text>
<text x="972" y="933" class="path">3→10→3</text>
<path d="M 960 921 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="963" class="label">设置自定义前缀</text>
<text x="972" y="993" class="note">前缀加在协议名前，包含已部署XHTTP。</text>
<text x="972" y="1018" class="path">3→10→4</text>
<path d="M 960 1006 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1048" class="label">清除前缀</text>
<text x="972" y="1078" class="note">与后缀设置互不影响。</text>
<text x="972" y="1103" class="path">3→10→5</text>
<path d="M 960 1091 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1133" class="label">清除后缀</text>
<text x="972" y="1163" class="note">不显示自定义后缀或主机名；保留前缀。</text>
<text x="972" y="1188" class="path">3→10→0</text>
<path d="M 960 1176 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1218" class="label">返回配置菜单</text>
<text x="972" y="1248" class="note">名称变更会刷新本地导出；Gitlab仍用9→2，客户端再拉取。</text>
<line x1="60" x2="1740" y1="1452" y2="1452" stroke="#c6d6e2"/>
<text x="60" y="1496" class="foot">• 本地订阅为HTTP文件服务，路径密码不能代替传输加密；通过不可信网络拉取时需自行做好可信HTTPS保护。</text>
<text x="60" y="1527" class="foot">• 客户端server是连接地址；Host/SNI是握手/路由身份。XHTTP Argo仅改变server时必须保留原隧道Host/SNI。</text>
<text x="60" y="1639" class="path">sing-box-yg / redrohu fork · 03 / 07 · 2026-11-21 · 源码与文字详表：docs/MENU-GUIDE.md</text>
</svg>
