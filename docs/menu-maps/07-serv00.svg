<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1953" viewBox="0 0 1800 1953" role="img" aria-labelledby="title desc">
<title id="title">Serv00 / Hostuno 独立菜单</title>
<desc id="desc">按实际输入路径列出菜单、子菜单、功能与影响范围。可配合MENU-GUIDE.md读取完整文字。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#162b3c}.h{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#526878}.group{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:600}.note{font-size:20px;fill:#42596b}.foot{font-size:23px;fill:#42596b}.path{font-family:Consolas,"Microsoft YaHei",monospace;fill:#526878;font-size:18px}</style>
<rect width="1800" height="1953" fill="#f2f6fa"/>
<rect x="60" y="44" width="8" height="65" rx="4" fill="#b45309"/>
<text x="90" y="84" class="h">07 / Serv00 / Hostuno 独立菜单</text>
<text x="90" y="127" class="sub">与VPS菜单不是同一套编号；这里的S只用来标识平台，不需输入。</text>
<text x="90" y="164" class="path">VPS v26.11.21-fork.18 / Serv00 v26.11.21-fork.2 · 路径数字对应实际输入顺序 · 非远程控制界面</text>
<rect x="60" y="195" width="820" height="971" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="60" y="195" width="8" height="64" rx="4" fill="#b45309"/>
<text x="90" y="239" class="group">S　主菜单0–9</text>
<text x="112" y="289" class="path">S→1</text>
<path d="M 100 277 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="319" class="label">安装三协议脚本</text>
<text x="112" y="349" class="note">VLESS REALITY / VMess WS(Argo) / HY2；不是VPS独立XHTTP安装器</text>
<text x="112" y="376" class="note">。</text>
<text x="112" y="401" class="path">S→2</text>
<path d="M 100 389 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="431" class="label">卸载脚本及相关账户资源</text>
<text x="112" y="461" class="note">需y/n确认；删除bin/domains等并清理账户网站配置，范围较广。</text>
<text x="112" y="486" class="path">S→3</text>
<path d="M 100 474 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="516" class="label">重启Sing-box主进程</text>
<text x="112" y="546" class="note">配置校验并重启核心，不重启Argo；不保证端到端恢复。</text>
<text x="112" y="571" class="path">S→4</text>
<path d="M 100 559 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="601" class="label">Argo切换 / 重置</text>
<text x="112" y="631" class="note">临时与固定互换、重用已有固定配置或换域名/Token。</text>
<text x="112" y="656" class="path">S→5</text>
<path d="M 100 644 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="686" class="label">更新本地SSH菜单脚本</text>
<text x="112" y="716" class="note">下载并校验脚本；不等于部署全部核心/管理应用。</text>
<text x="112" y="741" class="path">S→6</text>
<path d="M 100 729 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="771" class="label">查看节点与订阅链接</text>
<text x="112" y="801" class="note">刷新链接信息，包含三IP/Argo节点、反代IP/ProxyIP说明。</text>
<text x="112" y="826" class="path">S→7</text>
<path d="M 100 814 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="856" class="label">查看Sing-box / Mihomo配置</text>
<text x="112" y="886" class="note">生成并显示本地配置明文，含客户端凭据，勿公开。</text>
<text x="112" y="911" class="path">S→8</text>
<path d="M 100 899 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="941" class="label">随机重置三个协议端口</text>
<text x="112" y="971" class="note">自动选择新端口并刷新进程/导出；固定Argo需同步CF回源。</text>
<text x="112" y="996" class="path">S→9</text>
<path d="M 100 984 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1026" class="label">账户级清理 / 初始化</text>
<text x="112" y="1056" class="note">需y确认；删除家目录文件及账户进程，可能断开SSH。</text>
<text x="112" y="1081" class="path">S→0</text>
<path d="M 100 1069 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1111" class="label">退出菜单</text>
<text x="112" y="1141" class="note">不主动停止后台服务。</text>
<rect x="920" y="195" width="820" height="743" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="920" y="195" width="8" height="64" rx="4" fill="#b45309"/>
<text x="950" y="239" class="group">S → 1 / 4　交互与固定隧道</text>
<text x="994" y="289" class="path">S→1→IP</text>
<path d="M 982 277 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="319" class="label">选择服务器地址</text>
<text x="994" y="349" class="note">回车默认选择可用IP，或输入列出的候选IP。</text>
<text x="994" y="374" class="path">S→1→REALITY</text>
<path d="M 982 362 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="404" class="label">输入伪装域名</text>
<text x="994" y="434" class="note">回车使用账户官方域名，s使用blog.cloudflare.com，或输入合规</text>
<text x="994" y="461" class="note">域名。</text>
<text x="994" y="486" class="path">S→1→UUID</text>
<path d="M 982 474 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="516" class="label">共用UUID</text>
<text x="994" y="546" class="note">回车随机；不要在截图/公开文档中展示实际值。</text>
<text x="994" y="571" class="path">S→1→端口</text>
<path d="M 982 559 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="601" class="label">分配三协议端口</text>
<text x="994" y="631" class="note">check_port检查/分配2个TCP和1个UDP，具体以平台配额为准。</text>
<text x="994" y="656" class="path">S→1/4→回车</text>
<path d="M 982 644 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="686" class="label">使用临时Argo隧道</text>
<text x="994" y="716" class="note">生成临时域名；域名变化后需刷新客户端。</text>
<text x="994" y="741" class="path">S→1/4→g</text>
<path d="M 982 729 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="771" class="label">使用固定Argo隧道</text>
<text x="994" y="801" class="note">输入域名与Token；已有记录时可回车复用或替换，显示可能含Tok</text>
<text x="994" y="828" class="note">en，勿录屏。</text>
<text x="994" y="853" class="path">S→固定→回源</text>
<path d="M 982 841 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="883" class="label">Cloudflare端口同步</text>
<text x="994" y="913" class="note">HTTP回源为本机VMess端口，不是VPS XHTTP默认18080。</text>
<rect x="920" y="978" width="820" height="689" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="920" y="978" width="8" height="64" rx="4" fill="#b45309"/>
<text x="950" y="1022" class="group">管理 / 保活 API（不是SSH数字菜单）</text>
<text x="972" y="1072" class="path">API→/healthz</text>
<path d="M 960 1060 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1102" class="label">匿名健康端点</text>
<text x="972" y="1132" class="note">只返回网页服务健康，不重启代理，不证明代理可用。</text>
<text x="972" y="1157" class="path">API→/up</text>
<path d="M 960 1145 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1187" class="label">保活</text>
<text x="972" y="1217" class="note">POST + Bearer；等待子命令完成并检查进程，操作冲突返回409。</text>
<text x="972" y="1242" class="path">API→/re</text>
<path d="M 960 1230 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1272" class="label">重启</text>
<text x="972" y="1302" class="note">POST + Bearer；拒绝旧GET管理链接。</text>
<text x="972" y="1327" class="path">API→/rp</text>
<path d="M 960 1315 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1357" class="label">端口重置</text>
<text x="972" y="1387" class="note">POST + Bearer；有连接中断风险，客户端需刷新。</text>
<text x="972" y="1412" class="path">API→/jc</text>
<path d="M 960 1400 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1442" class="label">运行状态</text>
<text x="972" y="1472" class="note">POST + Bearer；仅状态，不公开完整进程参数和Token。</text>
<text x="972" y="1497" class="path">API→/list/&lt;UUID&gt;</text>
<path d="M 960 1485 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1527" class="label">订阅查询</text>
<text x="972" y="1557" class="note">保留原UUID链接；不是管理令牌，不应公开。</text>
<text x="972" y="1582" class="path">API→配置迁移</text>
<path d="M 960 1570 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1612" class="label">Worker / GitHub保活</text>
<text x="972" y="1642" class="note">HTTPS目标 + 独立令牌JSON；不再使用公开GET保活URL。</text>
<line x1="60" x2="1740" y1="1707" y2="1707" stroke="#c6d6e2"/>
<text x="60" y="1751" class="foot">• S→2不只是清理一份配置：会结束当前账户多个进程并删除bin/domains等及网站配置；S→9更会递归删除账户家目录内容，极高风险。</text>
<text x="60" y="1782" class="foot">• 本图记录实际行为，不代表建议执行破坏性操作；先离线备份，勿用于存有其他业务的共享账户。</text>
<text x="60" y="1813" class="foot">• 认证管理接口不是网页交互面板；可信HTTPS + POST + Authorization: Bearer，令牌保存在~/.serv00-management-token。</text>
<text x="60" y="1925" class="path">sing-box-yg / redrohu fork · 07 / 07 · 2026-11-21 · 源码与文字详表：docs/MENU-GUIDE.md</text>
</svg>
