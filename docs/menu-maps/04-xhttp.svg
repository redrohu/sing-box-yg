<title id="title">独立 XHTTP：直连与固定Argo</title>
<desc id="desc">按实际输入路径列出菜单、子菜单、功能与影响范围。可配合MENU-GUIDE.md读取完整文字。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#162b3c}.h{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#526878}.group{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:600}.note{font-size:20px;fill:#42596b}.foot{font-size:23px;fill:#42596b}.path{font-family:Consolas,"Microsoft YaHei",monospace;fill:#526878;font-size:18px}</style>
<rect width="1800" height="1761" fill="#f2f6fa"/>
<rect x="60" y="44" width="8" height="65" rx="4" fill="#6d28d9"/>
<text x="90" y="84" class="h">04 / 独立 XHTTP：直连与固定Argo</text>
<text x="90" y="127" class="sub">入口3→11；两个节点共存，但凭据、服务、配置与启停分离。</text>
<text x="90" y="164" class="path">VPS v26.11.21-fork.18 / Serv00 v26.11.21-fork.2 · 路径数字对应实际输入顺序 · 非远程控制界面</text>
<rect x="60" y="195" width="820" height="1168" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="60" y="195" width="8" height="64" rx="4" fill="#6d28d9"/>
<text x="90" y="239" class="group">3 → 11　直连REALITY节点</text>
<text x="112" y="289" class="path">3→11→1</text>
<path d="M 100 277 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="319" class="label">部署直连节点</text>
<text x="112" y="349" class="note">先装Sing-box；选模式、独立TCP端口（默认443）、REALITY目标域</text>
<text x="112" y="376" class="note">名。</text>
<text x="134" y="401" class="path">3→11→1→模式1</text>
<path d="M 122 389 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="431" class="label">Encryption + Vision（默认）</text>
<text x="134" y="461" class="note">独立VLESS Encryption凭据；路径/，保留外层REALITY。</text>
<text x="134" y="486" class="path">3→11→1→模式2</text>
<path d="M 122 474 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="134" y="516" class="label">普通XHTTP + REALITY</text>
<text x="134" y="546" class="note">不添加VLESS Encryption与Vision；普通模式路径自动随机。</text>
<text x="112" y="571" class="path">3→11→2</text>
<path d="M 100 559 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="601" class="label">查看节点并刷新本地订阅</text>
<text x="112" y="631" class="note">更新Xray客户端JSON、Mihomo和URI；远端仍用9→2。</text>
<text x="112" y="656" class="path">3→11→3</text>
<path d="M 100 644 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="686" class="label">检查配置并重启</text>
<text x="112" y="716" class="note">只操作独立sbox-xhttp服务，不重启Sing-box。</text>
<text x="112" y="741" class="path">3→11→4</text>
<path d="M 100 729 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="771" class="label">停止直连服务</text>
<text x="112" y="801" class="note">保留配置；再次使用先重启，停止不代表移除订阅节点。</text>
<text x="112" y="826" class="path">3→11→5</text>
<path d="M 100 814 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="856" class="label">查看状态</text>
<text x="112" y="886" class="note">本机服务状态，不是公网测速或客户端连接证明。</text>
<text x="112" y="911" class="path">3→11→6</text>
<path d="M 100 899 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="941" class="label">查看日志</text>
<text x="112" y="971" class="note">独立服务journal或OpenRC日志。</text>
<text x="112" y="996" class="path">3→11→7</text>
<path d="M 100 984 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1026" class="label">仅卸载直连XHTTP</text>
<text x="112" y="1056" class="note">需输入yes；删除本机直连配置/密钥，保留XHTTP Argo。</text>
<text x="112" y="1081" class="path">3→11→8</text>
<path d="M 100 1069 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1111" class="label">已有普通节点升级文章模式</text>
<text x="112" y="1141" class="note">先备份；保留端口/UUID/REALITY密钥，启用Encryption/Vision并改</text>
<text x="112" y="1168" class="note">路径/；必须换客户端配置。</text>
<text x="112" y="1193" class="path">3→11→9</text>
<path d="M 100 1181 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1223" class="label">进入XHTTP固定Argo菜单</text>
<text x="112" y="1253" class="note">无需先部署直连节点，已有Sing-box即可单独部署。</text>
<text x="112" y="1278" class="path">3→11→0</text>
<path d="M 100 1266 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="112" y="1308" class="label">结束当前子菜单</text>
<text x="112" y="1338" class="note">不停止服务，不保证自动重绘主菜单。</text>
<rect x="920" y="195" width="820" height="1280" rx="18" fill="#fff" stroke="#d5e0e9"/>
<rect x="920" y="195" width="8" height="64" rx="4" fill="#6d28d9"/>
<text x="950" y="239" class="group">3 → 11 → 9　固定Argo节点</text>
<text x="972" y="289" class="path">3→11→9→1</text>
<path d="M 960 277 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="319" class="label">部署独立固定隧道节点</text>
<text x="972" y="349" class="note">输入完整域名、回环HTTP端口（默认18080）、服务器上Token文件绝</text>
<text x="972" y="376" class="note">对路径。</text>
<text x="994" y="401" class="path">3→11→9→1→Cloudflare准备</text>
<path d="M 982 389 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="431" class="label">隧道 + 域名 + 已发布应用</text>
<text x="994" y="461" class="note">独立隧道路由：HTTP 127.0.0.1:18080，路径留空；端口与脚本输</text>
<text x="994" y="488" class="note">入一致。</text>
<text x="972" y="513" class="path">3→11→9→2</text>
<path d="M 960 501 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="543" class="label">查看节点并刷新本地订阅</text>
<text x="972" y="573" class="note">Xray client.json、Mihomo与聚合URI；Gitlab另用9→2。</text>
<text x="972" y="598" class="path">3→11→9→3</text>
<path d="M 960 586 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="628" class="label">检查配置并重启</text>
<text x="972" y="658" class="note">操作sbox-xhttp-argo和sbox-xhttp-argo-tunnel两服务。</text>
<text x="972" y="683" class="path">3→11→9→4</text>
<path d="M 960 671 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="713" class="label">停止节点与固定隧道</text>
<text x="972" y="743" class="note">保留配置及Token；不影响VMess Argo/直连REALITY。</text>
<text x="972" y="768" class="path">3→11→9→5</text>
<path d="M 960 756 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="798" class="label">查看两项服务状态</text>
<text x="972" y="828" class="note">只证明本机服务状态，不证明云端路由或客户端成功。</text>
<text x="972" y="853" class="path">3→11→9→6</text>
<path d="M 960 841 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="883" class="label">查看节点及隧道日志</text>
<text x="972" y="913" class="note">排查回源拒绝、隧道未连、认证或握手错误。</text>
<text x="972" y="938" class="path">3→11→9→7</text>
<path d="M 960 926 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="968" class="label">卸载本机固定Argo节点</text>
<text x="972" y="998" class="note">输入yes；删本机服务/配置/密钥/Token，不删CF云端隧道/路由。</text>
<text x="972" y="1023" class="path">3→11→9→8</text>
<path d="M 960 1011 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1053" class="label">独立连接地址设置</text>
<text x="972" y="1083" class="note">只改此XHTTP Argo，不受3→9的VMess设置影响。</text>
<text x="994" y="1108" class="path">3→11→9→8→1</text>
<path d="M 982 1096 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="1138" class="label">设置优选域名 / IPv4 / IPv6</text>
<text x="994" y="1168" class="note">无协议、端口、路径；仅改server/address，Host/SNI保留隧道域</text>
<text x="994" y="1195" class="note">名。</text>
<text x="994" y="1220" class="path">3→11→9→8→2</text>
<path d="M 982 1208 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="1250" class="label">恢复默认隧道域名</text>
<text x="994" y="1280" class="note">移除自定义连接地址；不更改UUID、Token或服务端口。</text>
<text x="994" y="1305" class="path">3→11→9→8→0</text>
<path d="M 982 1293 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="994" y="1335" class="label">取消地址设置</text>
<text x="994" y="1365" class="note">不保存新设置。</text>
<text x="972" y="1390" class="path">3→11→9→0</text>
<path d="M 960 1378 v 20 h 8" fill="none" stroke="#b6c7d3" stroke-width="1.5"/>
<text x="972" y="1420" class="label">结束当前子菜单</text>
<text x="972" y="1450" class="note">云端对象不会随返回动作改变。</text>
<line x1="60" x2="1740" y1="1515" y2="1515" stroke="#c6d6e2"/>
<text x="60" y="1559" class="foot">• 直连默认REALITY + VLESS Encryption（X25519认证）+ Vision，mode:auto；普通模式不带额外Encryption/Vision。</text>
<text x="60" y="1590" class="foot">• 固定Argo为TLS + XHTTP packet-up + Encryption/Vision；本机HTTP回源，不叠加REALITY，也不是端到端REALITY。</text>
<text x="60" y="1621" class="foot">• 仅导出给兼容的Mihomo/Xray客户端及通用分享；官方Sing-box JSON不含XHTTP。</text>
<text x="60" y="1733" class="path">sing-box-yg / redrohu fork · 04 / 07 · 2026-11-21 · 源码与文字详表：docs/MENU-GUIDE.md</text>
</svg>
