name: Keep Servers Alive
# 如果你已安装了Serv00本地SSH脚本，不要再运行此github部署了，这样会造成进程爆满，必须二选一！
#
# 账号信息只能放在仓库 Settings → Secrets and variables → Actions：
#   Secret  SERV00_ACCOUNTS     （必填）账号 JSON 数组，格式见下方
#   Secret  SERV00_KNOWN_HOSTS  （可选，推荐）服务器 SSH 主机公钥，内容为 known_hosts 格式；
#                               可在可信网络执行 ssh-keyscan sX.serv00.com 并核对指纹后填入。
#                               设置后严格校验主机密钥；未设置时仅 accept-new（无法发现中间人）。
#   Variable SERV00_SCRIPT_URL  （可选）远程执行的 serv00keep.sh 地址，默认本 fork 的 main 分支；
#                               可改为固定提交的 raw.githubusercontent.com 地址。
# 不要把账号、密码、UUID 或 Argo Token 写进本文件：公开仓库的工作流文件和 Actions 日志任何人可见。
#
# SERV00_ACCOUNTS 字段：
#   RES(必填)：n表示每次不重置部署，y表示每次重置部署。REP(必填)：n表示不重置随机端口(三个端口留空)，y表示重置端口(三个端口留空)。
#   SSH_USER(必填)表示serv00账号名。SSH_PASS(必填)表示serv00密码。HOST(必填)表示登录serv00服务器域名。
#   REALITY表示reality域名(留空表示serv00官方域名：你serv00账号名.serv00.net)。SUUID表示uuid(留空表示随机uuid)。
#   TCP1_PORT表示vless的tcp端口、TCP2_PORT表示vmess的tcp端口、UDP_PORT表示hy2的udp端口(留空表示随机端口)。
#   ARGO_DOMAIN表示argo固定域名、ARGO_AUTH表示argo固定域名token(两者留空表示临时域名)。
# 示例（占位文本，不是有效凭据）：
#   [
#     {"RES":"n", "REP":"n", "SSH_USER":"你的账号名", "SSH_PASS":"你的密码", "HOST":"s1.serv00.com",
#      "REALITY":"", "SUUID":"", "TCP1_PORT":"", "TCP2_PORT":"", "UDP_PORT":"", "ARGO_DOMAIN":"", "ARGO_AUTH":""}
#   ]
# 日志只显示第几个账户及结果，不显示账号、服务器、节点或订阅；节点请通过 SSH 或订阅地址查看。
on:
  #如使用保活网页，请禁用cron，保持下面两行开头的#符号，以防止cron与网页保活重复运行造成进程爆满
  #schedule:
  # - cron: '0 */4 * * *' # 每4小时执行一次（私库每月500分钟运行时长，每天16分钟）
  workflow_dispatch:

permissions: {}

concurrency:
  group: serv00-keepalive
  cancel-in-progress: false

jobs:
  keep_servers_alive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass jq

      - name: Process each account
        env:
          ACCOUNTS: ${{ secrets.SERV00_ACCOUNTS }}
          KNOWN_HOSTS: ${{ secrets.SERV00_KNOWN_HOSTS }}
          SCRIPT_URL: ${{ vars.SERV00_SCRIPT_URL }}
        run: |
          echo "自动远程部署并保活Serv00三合一协议脚本【Github】 原作者：github.com/yonggekkk  本fork：github.com/redrohu/sing-box-yg"
          SCRIPT_URL=${SCRIPT_URL:-https://raw.githubusercontent.com/redrohu/sing-box-yg/main/serv00keep.sh}
          if [[ ! "$SCRIPT_URL" =~ ^https://raw\.githubusercontent\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/serv00keep\.sh$ ]]; then
            echo "::error::SERV00_SCRIPT_URL 必须是 https://raw.githubusercontent.com/<用户>/<仓库>/<分支或提交>/serv00keep.sh"
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "object")' >/dev/null 2>&1 <<< "${ACCOUNTS:-}"; then
            echo "::error::请在仓库 Secrets 中设置 SERV00_ACCOUNTS（非空 JSON 数组），不要写入工作流文件"
            exit 1
          fi
          # GitHub only masks the whole secret; mask each credential field before any output.
          while IFS= read -r value; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done < <(jq -r '.[] | ((.SSH_PASS, .ARGO_AUTH | strings | select(length > 0)),
                                 (.SSH_USER, .HOST, .SUUID, .ARGO_DOMAIN, .REALITY | strings | select(length >= 4)))' <<< "$ACCOUNTS")

          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/serv00_known_hosts"
            chmod 600 "$HOME/.ssh/serv00_known_hosts"
            SSH_OPTIONS=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/serv00_known_hosts")
          else
            echo "::warning::未设置 SERV00_KNOWN_HOSTS：运行器每次都是全新环境，accept-new 无法发现主机密钥被替换"
            SSH_OPTIONS=(-o StrictHostKeyChecking=accept-new)
          fi
          SSH_OPTIONS+=(-o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o LogLevel=ERROR)

          valid_account() {
            [[ "$SSH_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]] || return 1
            [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || return 1
            [[ -n "$SSH_PASS" && "$RES" =~ ^[YyNn]$ && "$REP" =~ ^[YyNn]$ ]] || return 1
            local port
            for port in "$TCP1_PORT" "$TCP2_PORT" "$UDP_PORT"; do
              if [ -z "$port" ]; then continue; fi
              [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( 10#$port >= 1 && 10#$port <= 65535 )) || return 1
            done
            return 0
          }

          remote_ssh() {
            SSHPASS="$SSH_PASS" sshpass -e ssh "${SSH_OPTIONS[@]}" "$SSH_USER@$HOST" "$@"
          }

          # Values travel as shell-quoted data over stdin: never in argv, the command string or logs.
          run_remote_command() {
            {
              printf 'export reym=%q UUID=%q vless_port=%q vmess_port=%q hy2_port=%q reset=%q resport=%q ARGO_DOMAIN=%q ARGO_AUTH=%q SERV00_SCRIPT_URL=%q\n' \
                "$REALITY" "$SUUID" "$TCP1_PORT" "$TCP2_PORT" "$UDP_PORT" "$RES" "$REP" "$ARGO_DOMAIN" "$ARGO_AUTH" "$SCRIPT_URL"
              cat <<'REMOTE'
          script=$(mktemp "$HOME/.serv00keep.XXXXXX") || exit 1
          trap 'rm -f "$script"' EXIT
          curl -fsSL --connect-timeout 10 --max-time 120 "$SERV00_SCRIPT_URL" -o "$script" &&
              bash -n "$script" && bash "$script"
          REMOTE
            } | remote_ssh bash -s
          }

          # Same liveness check as kp.sh: generated process names only, no credentials in the query.
          check_process='workdir="$HOME/domains/$(whoami | tr "[:upper:]" "[:lower:]").serv00.net/logs"; for file in sb.txt ag.txt; do name=$(cat "$workdir/$file") || exit 1; case "$name" in ""|-*|*[!a-zA-Z0-9_.-]*) exit 1;; esac; pgrep -x "$name" >/dev/null || exit 1; done'

          count=0
          passed=0
          failed=0
          # Accounts are read from fd 3 so ssh cannot consume the remaining accounts from stdin.
          while IFS= read -r account <&3; do
            count=$((count + 1))
            RES=$(jq -r '.RES // "n"' <<< "$account")
            REP=$(jq -r '.REP // "n"' <<< "$account")
            SSH_USER=$(jq -r '.SSH_USER // empty' <<< "$account")
            SSH_PASS=$(jq -r '.SSH_PASS // empty' <<< "$account")
            REALITY=$(jq -r '.REALITY // empty' <<< "$account")
            SUUID=$(jq -r '.SUUID // empty' <<< "$account")
            TCP1_PORT=$(jq -r '.TCP1_PORT // empty' <<< "$account")
            TCP2_PORT=$(jq -r '.TCP2_PORT // empty' <<< "$account")
            UDP_PORT=$(jq -r '.UDP_PORT // empty' <<< "$account")
            HOST=$(jq -r '.HOST // empty' <<< "$account")
            ARGO_DOMAIN=$(jq -r '.ARGO_DOMAIN // empty' <<< "$account")
            ARGO_AUTH=$(jq -r '.ARGO_AUTH // empty' <<< "$account")
            if ! valid_account; then
              echo "::error::第 $count 个账户参数无效（检查 SSH_USER、SSH_PASS、HOST、RES/REP 为 y/n、端口为 1-65535 或留空），已跳过"
              failed=$((failed + 1)); continue
            fi
            if ! remote_ssh exit </dev/null >/dev/null 2>&1; then
              echo "::error::第 $count 台服务器 SSH 登录失败：账号、密码、服务器名称或主机密钥有误，或服务器维护中"
              failed=$((failed + 1)); continue
            fi
            if [[ "$RES" =~ ^[Yy]$ ]] || ! remote_ssh "$check_process" </dev/null >/dev/null 2>&1; then
              echo "第 $count 台服务器：进程未运行或要求重置，开始修复/重置部署……"
              # Remote output contains node links and subscriptions: never write it to public logs.
              if ! run_remote_command >/dev/null 2>&1; then
                echo "::error::第 $count 台服务器部署命令失败"
                failed=$((failed + 1)); continue
              fi
              sleep 5
              if remote_ssh "$check_process" </dev/null >/dev/null 2>&1; then
                echo "第 $count 台服务器：部署完成，进程检查通过"
                passed=$((passed + 1))
              else
                echo "::error::第 $count 台服务器：部署命令已结束，但进程检查未通过"
                failed=$((failed + 1))
              fi
            else
              echo "第 $count 台服务器：进程正常运行"
              passed=$((passed + 1))
            fi
          done 3< <(jq -c '.[]' <<< "$ACCOUNTS")
          echo "完成：正常 $passed，失败 $failed"
          [ "$failed" -eq 0 ]
