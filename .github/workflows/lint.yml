name: Lint and repository hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shell syntax (bash -n)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            bash -n "$file" || { echo "::error file=$file::bash -n failed"; status=1; }
          done < <(git ls-files -z -- '*.sh')
          exit "$status"

      - name: JavaScript syntax (node --check)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            node --check "$file" || { echo "::error file=$file::node --check failed"; status=1; }
          done < <(git ls-files -z -- '*.js')
          exit "$status"

      - name: YAML, JSON and Python syntax
        run: |
          python -m pip install -r tests/requirements.txt
          python - <<'PY'
          import json, pathlib, subprocess, sys, yaml
          files = subprocess.run(['git', 'ls-files', '-z'], capture_output=True, check=True).stdout.decode().split('\0')
          failed = False
          for name in filter(None, files):
              path = pathlib.Path(name)
              try:
                  if path.suffix in ('.yml', '.yaml'):
                      yaml.safe_load(path.read_text(encoding='utf-8'))
                  elif path.suffix == '.json':
                      json.loads(path.read_text(encoding='utf-8-sig'))
                  elif path.suffix == '.py':
                      compile(path.read_text(encoding='utf-8'), name, 'exec')
              except Exception as error:
                  print(f'::error file={name}::{type(error).__name__}: {error}')
                  failed = True
          sys.exit(failed)
          PY

      - name: Repository hygiene
        run: |
          status=0
          # Local evidence/assistant folders and credential files must never be tracked.
          tracked=$(git ls-files -- review-artifacts .workbuddy '*.token' '*-token.txt' 'gitlabtoken.txt' '.serv00-management-token' '.env' '.env.*')
          if [ -n "$tracked" ]; then
            printf '::error::Tracked local-only or credential files:\n%s\n' "$tracked"; status=1
          fi
          # Account workflows must read credentials from Secrets, never inline values.
          for file in serv00.yml SSH.yml; do
            if grep -nE 'ACCOUNTS: *>|SSH_PASS"? *: *"[^"]+"[^#]*$|StrictHostKeyChecking=no|sshpass -p' "$file" | grep -v '^\s*[0-9]*:\s*#'; then
              echo "::error file=$file::inline credentials or insecure SSH options"; status=1
            fi
          done
          # Cloudflare Tunnel tokens and GitLab personal tokens in any tracked text file.
          if git grep -nIE 'eyJh[A-Za-z0-9_-]{60,}|glpat-[A-Za-z0-9_-]{20,}' -- . ':!tests/**'; then
            echo '::error::possible tunnel or GitLab token committed'; status=1
          fi
          exit "$status"

  shellcheck:
    # Blocking at severity "error" only (real bugs such as broken quoting/parsing). Warnings and style
    # findings in the legacy menu code are not enforced. tests/fixtures holds frozen old code: not linted.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (severity error)
        run: |
          shellcheck --version
          status=0
          # Frozen copies of old code are not linted; review-artifacts must not be tracked at all (hygiene check).
          git ls-files -z -- '*.sh' ':!tests/fixtures/**' ':!review-artifacts/**' | xargs -0 shellcheck -S error -s bash -f gcc > shellcheck.txt || status=$?
          count=$(wc -l < shellcheck.txt)
          {
            echo "### ShellCheck (severity: error) — $count finding(s)"
            echo '```'
            head -n 200 shellcheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning|note): (.*)$/::error file=\1,line=\2,col=\3::\5/' shellcheck.txt | head -n 50
          # xargs returns 123 when shellcheck reports findings; anything else non-zero is a tool failure.
          if [ "$count" -gt 0 ] || [ "$status" -ne 0 ]; then exit 1; fi
