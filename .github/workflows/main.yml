name: Authenticated Serv00 Keepalive

on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  fetch-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run authenticated keepalive requests
        # secrets.http must now be JSON, not a list of public GET URLs:
        # [{"url":"https://s1.user.serv00.net/up","token":"<management token>"}]
        env:
          SERV00_TARGETS: ${{ secrets.http }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, http.client, json, os, re, urllib.parse

          targets = json.loads(os.environ.get('SERV00_TARGETS') or '[]')
          if not isinstance(targets, list) or not targets:
              raise SystemExit('Configure secrets.http as the authenticated target JSON array.')

          def keepalive(target):
              connection = None
              try:
                  url = urllib.parse.urlsplit(target['url'])
                  token = target['token']
                  if (url.scheme != 'https' or not url.hostname or url.username or url.password
                          or url.path not in ('/up', '/re') or url.fragment
                          or not isinstance(token, str) or not re.fullmatch(r'[a-fA-F0-9]{64}', token)):
                      raise ValueError('Invalid HTTPS management target.')
                  connection = http.client.HTTPSConnection(url.hostname, url.port or 443, timeout=260)
                  connection.request('POST', urllib.parse.urlunsplit(('', '', url.path, url.query, '')),
                                     headers={'Authorization': 'Bearer ' + token})
                  response = connection.getresponse()
                  if response.status != 200:
                      raise ValueError('Management request rejected.')
                  result = json.loads(response.read(1024 * 1024))
                  return result.get('ok') is True
              except Exception:
                  # Never print URLs, tokens, response bodies or raw exceptions.
                  return False
              finally:
                  if connection is not None:
                      connection.close()

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(keepalive, targets))
          print('Completed:', sum(results), 'Failed:', len(results) - sum(results))
          if not all(results):
              raise SystemExit(1)
          PY
