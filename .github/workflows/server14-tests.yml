name: Server 1.14 template tests
on:
  push:
    paths: [sb.sh, server14.sh, 'tests/**', '.github/workflows/server14-tests.yml']
  pull_request:
    paths: [sb.sh, server14.sh, 'tests/**', '.github/workflows/server14-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq and official core
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -fLS --retry 2 -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
      - name: Shell syntax and real-core tests
        env:
          SB14_TEST_BIN: /tmp/sing-box-1.14.4-linux-amd64/sing-box
          SB14_TEST_LOG: test-commands.json
        run: |
          bash -n sb.sh
          bash -n server14.sh
          python3 tests/test_server14.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server14-test-commands
          path: test-commands.json
