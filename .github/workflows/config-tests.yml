name: Generated sing-box configurations

on:
  push:
    # *.yml / *.js / docs / README are covered by the workflow, Serv00 web and menu-guide tests.
    paths: ['*.sh', '*.yml', '*.js', '*.md', 'version', 'sversion', 'docs/**', 'tests/**',
            '.github/workflows/config-tests.yml', '.github/workflows/main.yml']
  pull_request:
    paths: ['*.sh', '*.yml', '*.js', '*.md', 'version', 'sversion', 'docs/**', 'tests/**',
            '.github/workflows/config-tests.yml', '.github/workflows/main.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-configurations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real sing-box test cores
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl
          mkdir -p "$RUNNER_TEMP/sbcheck"
          for version in 1.10.7 1.12.25 1.13.21 1.14.4; do
            name="sing-box-${version}-linux-amd64"
            curl -fL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v${version}/${name}.tar.gz" -o "$RUNNER_TEMP/$name.tar.gz"
            tar xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP/sbcheck"
          done
      - name: Generate and check server and client profiles
        env:
          SB_TEST_CORES: ${{ runner.temp }}/sbcheck
          SB_TEST_OUTPUT: ${{ runner.temp }}/config-results
          XRAY_TEST_BIN: ${{ runner.temp }}/xray/xray
          MIHOMO_TEST_BIN: ${{ runner.temp }}/mihomo/mihomo
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fL --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip -o "$RUNNER_TEMP/xray.zip"
          curl -fL --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip.dgst -o "$RUNNER_TEMP/xray.dgst"
          expected=$(awk -F '= *' '/^SHA2-256=/{gsub(/\r/,"",$2); print $2}' "$RUNNER_TEMP/xray.dgst")
          test "$expected" = "$(sha256sum "$RUNNER_TEMP/xray.zip" | cut -d ' ' -f1)"
          unzip -q "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"
          chmod +x "$XRAY_TEST_BIN"
          mkdir -p "$RUNNER_TEMP/mihomo"
          curl -fL --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-compatible-v1.19.34.gz -o "$RUNNER_TEMP/mihomo.gz"
          echo "2763f5b414527f7baf6dc57e3f82f3ab561eedf34bfd7c2f2cde1f7e592efe06  $RUNNER_TEMP/mihomo.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$MIHOMO_TEST_BIN"
          chmod +x "$MIHOMO_TEST_BIN"
          python -m pip install -r tests/requirements.txt
          python -m unittest discover -s tests -v
      - name: Re-run jq-dependent tests with jq 1.8
        # Ubuntu's jq is 1.7; jq 1.8 parses "A and B as $x | C" differently, and VPS distributions
        # already ship 1.8. The official binary is verified against the same release's sha256sum.txt.
        env:
          SB_TEST_CORES: ${{ runner.temp }}/sbcheck
          SB_TEST_OUTPUT: ${{ runner.temp }}/config-results/jq-1.8
          XRAY_TEST_BIN: ${{ runner.temp }}/xray/xray
          MIHOMO_TEST_BIN: ${{ runner.temp }}/mihomo/mihomo
        run: |
          dir="$RUNNER_TEMP/jq18"
          mkdir -p "$dir"
          base=https://github.com/jqlang/jq/releases/download/jq-1.8.2
          curl -fL --retry 3 "$base/jq-linux-amd64" -o "$dir/jq-linux-amd64"
          curl -fL --retry 3 "$base/sha256sum.txt" -o "$dir/sha256sum.txt"
          (cd "$dir" && grep -E '[ *]jq-linux-amd64$' sha256sum.txt | sha256sum -c -)
          mv "$dir/jq-linux-amd64" "$dir/jq"
          chmod +x "$dir/jq"
          export PATH="$dir:$PATH"
          jq --version
          cd tests
          python -m unittest -v test_xhttp_argo test_config_edits test_sb_helpers test_sbwpph \
            test_export_fields test_subscription_safety test_menu_cache test_update_log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-config-validation
          path: ${{ runner.temp }}/config-results
